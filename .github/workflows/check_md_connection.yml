name: Step 1 - MotherDuck 연결 테스트 & DB 스키마 확인

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/etf-june-rebalancing-qb151h

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install duckdb
        run: pip install duckdb==1.1.3 pandas

      - name: Check MotherDuck connection & schema
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          python scripts/check_md_connection.py
